<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Xtramile Weather</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container">
        <header>
            <h1>Xtramile Weather</h1>
            <p>Check current weather and save your favorite cities.</p>
        </header>

        <section class="panel">
            <h2>Find Weather</h2>

            <div class="form-grid">
                <label>
                    Country
                    <select id="countrySelect">
                        <option value="">Select country</option>
                    </select>
                </label>

                <label>
                    City
                    <select id="citySelect" disabled>
                        <option value="">Select city</option>
                    </select>
                </label>
            </div>

            <div class="actions">
                <button id="loadWeatherButton" disabled>
                    Show Weather
                </button>

                <button id="addFavoriteButton"
                        class="secondary"
                        disabled>
                    Add to Favorites
                </button>
            </div>

            <p id="statusMessage" class="status"></p>

            <article id="weatherResult"
                     class="weather-card hidden">
            </article>
        </section>

        <section class="panel">
            <h2>Favorite Cities</h2>

            <div id="favoriteList" class="favorite-list">
                <p>Loading favorites...</p>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
